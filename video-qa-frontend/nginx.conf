# =============================================================================
# nginx.conf — Nginx config for VideoChat AI frontend (HTTP & HTTPS)
# =============================================================================
# Serves static React build on port 80 and port 443 (SSL).
# Proxies /api/* to FastAPI backend.
# =============================================================================

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Root directory where `vite build` output lands (set in Dockerfile)
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Static assets — serve from disk, cache aggressively
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # -------------------------------------------------------------------------
    # API proxy — forward /api/* to the backend service
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # -------------------------------------------------------------------------
    # SPA fallback
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin" always;

    server_tokens off;
}
