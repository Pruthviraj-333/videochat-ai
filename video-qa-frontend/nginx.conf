# =============================================================================
# nginx.conf — Nginx config for the VideoChat AI frontend container
# =============================================================================
# Nginx serves the React static build AND proxies /api/* to the FastAPI
# backend.  This is the key trick that lets the browser talk to a single
# origin (no CORS issues) and lets us change the backend host without
# rebuilding the frontend image.
# =============================================================================

server {
    listen 80;
    server_name _;          # Accept any hostname

    # Root directory where `vite build` output lands (set in Dockerfile)
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Static assets — serve from disk, cache aggressively.
    # Vite hashes filenames so cache-busting is automatic.
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # -------------------------------------------------------------------------
    # API proxy — forward /api/* to the backend service.
    # The `rewrite` strips the /api prefix before forwarding, so
    # /api/health -> http://backend:8000/health
    # /api/ask    -> http://backend:8000/ask
    # This matches the rewrite in vite.config.js so dev and prod behave the same.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;

        # Forward the real client IP and host headers to FastAPI
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Generous timeouts because transcript processing can be slow
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # -------------------------------------------------------------------------
    # SPA fallback — for React Router (currently no routing, but future-proof).
    # Any path that is NOT a real file falls back to index.html.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Security headers — basic hardening, good to mention in interviews.
    # -------------------------------------------------------------------------
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin" always;

    # Disable server version leaking
    server_tokens off;
}

